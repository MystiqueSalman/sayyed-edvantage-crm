{% extends "base.html" %}
{% block title %}New Project Brief{% endblock %}
{% block content %}
<div class="panel" style="max-width:640px; margin:30px auto">
  <h2>New Project Brief</h2>
  <form method="post">
    <label>Course</label>
    <select name="course_id" required>{% for c in courses %}<option value="{{ c.id }}">{{ c.title }}</option>{% endfor %}</select>
    <label>Project title</label><input type="text" name="title" required>
    <label>Brief / requirements</label><textarea name="description" rows="5" placeholder="What must the student build? Requirements, deliverables, evaluation criteria..."></textarea>
    <label>Skills practiced (comma separated)</label><input type="text" name="skills" placeholder="e.g. python, pandas, streamlit">
    <div class="two-col">
      <div><label>Deadline</label><input type="date" name="deadline"></div>
      <div><label>Max marks</label><input type="number" name="max_marks" value="100" min="1" max="1000"></div>
    </div>
    <p><button class="btn btn-gold" type="submit" style="margin-top:12px">Publish Brief</button>
    <a class="btn btn-ghost" href="{{ url_for('manage.manage_projects') }}" style="margin-left:10px">Cancel</a></p>
  </form>
</div>
{% endblock %}
