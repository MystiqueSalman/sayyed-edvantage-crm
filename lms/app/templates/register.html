{% extends "base.html" %}
{% block title %}Create Account — Sayyed EdVantage LMS{% endblock %}
{% block content %}
<div class="panel" style="max-width:440px; margin:40px auto">
  <h2>Join Sayyed EdVantage</h2>
  <p style="color:var(--muted)">Free student account — enroll in courses in minutes.</p>
  <form method="post">
    <label>Full name</label>
    <input type="text" name="name" required autofocus>
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Password (min 6 characters)</label>
    <input type="password" name="password" required minlength="6">
    <p><button class="btn btn-gold" type="submit" style="width:100%; margin-top:14px">Create Account</button></p>
  </form>
  <p style="color:var(--muted); font-size:.9rem">Already registered? <a href="{{ url_for('auth.login') }}">Login</a></p>
</div>
{% endblock %}
