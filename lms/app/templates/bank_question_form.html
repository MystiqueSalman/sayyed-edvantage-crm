{% extends "base.html" %}
{% block title %}New Bank Question{% endblock %}
{% block content %}
<div class="panel" style="max-width:640px; margin:30px auto">
  <h2>New Bank Question</h2>
  <p style="color:var(--muted)">Saved to the question bank — optionally attached straight to a quiz.</p>
  <form method="post">
    <div class="two-col">
      <div><label>Course</label>
        <select name="course_id" required>{% for c in courses %}<option value="{{ c.id }}">{{ c.title }}</option>{% endfor %}</select></div>
      <div><label>Attach to quiz (optional)</label>
        <select name="quiz_id"><option value="">— bank only —</option>
          {% for qz in quizzes %}<option value="{{ qz.id }}">{{ qz.module.course.title }} · {{ qz.title }}</option>{% endfor %}</select></div>
    </div>
    <label>Question</label><textarea name="text" rows="3" required></textarea>
    <div class="two-col">
      <div><label>Question type</label>
        <select name="qtype">
          <option value="mcq_single">MCQ — single answer</option>
          <option value="mcq_multiple">MCQ — multiple answers</option>
          <option value="true_false">True / False</option>
          <option value="fill_blank">Fill in the blank</option>
          <option value="matching">Matching</option>
          <option value="descriptive">Descriptive (faculty graded)</option>
        </select></div>
      <div><label>Marks</label><input type="number" name="marks" value="1" min="0.5" step="0.5"></div>
    </div>
    <div class="two-col">
      <div><label>Difficulty</label>
        <select name="difficulty"><option>easy</option><option selected>medium</option><option>hard</option></select></div>
      <div><label>Topic</label><input type="text" name="topic"></div>
    </div>
    <label>Skill tags (comma separated)</label><input type="text" name="skills">
    <label>Option A</label><input type="text" name="option_a">
    <label>Option B</label><input type="text" name="option_b">
    <label>Option C</label><input type="text" name="option_c">
    <label>Option D</label><input type="text" name="option_d">
    <label>Correct option (single) / correct options (tick, multiple)</label><br>
    <select name="correct">{% for o in ['A','B','C','D'] %}<option>{{ o }}</option>{% endfor %}</select>
    {% for o in ['A','B','C','D'] %}<label class="opt" style="display:inline-block;margin:0 10px"><input type="checkbox" name="correct_multi" value="{{ o }}"> {{ o }}</label>{% endfor %}
    <label style="margin-top:10px">True/False answer</label>
    <select name="correct_tf"><option value="true">True</option><option value="false">False</option></select>
    <label>Accepted answers — fill in the blank (one per line)</label>
    <textarea name="accepted" rows="2"></textarea>
    <label>Matching — left items (one per line)</label><textarea name="match_left" rows="2"></textarea>
    <label>Matching — right items (one per line, same order)</label><textarea name="match_right" rows="2"></textarea>
    <label>Model answer — descriptive (optional)</label><textarea name="model_answer" rows="2"></textarea>
    <p><button class="btn btn-gold" type="submit" style="margin-top:12px">Save Question</button>
    <a class="btn btn-ghost" href="{{ url_for('manage.question_bank') }}" style="margin-left:10px">Cancel</a></p>
  </form>
</div>
{% endblock %}
