{% extends "base.html" %}
{% block title %}Set New Password — Sayyed EdVantage LMS{% endblock %}
{% block content %}
<div class="panel" style="max-width:440px; margin:40px auto">
  <h2>Choose a new password</h2>
  <p style="color:var(--muted)">Your reset link is valid — pick a new password (min 6 characters).</p>
  <form method="post" action="{{ url_for('auth13.reset_password', token=token) }}">
    <label>New password</label>
    <input type="password" name="password" required minlength="6" autofocus>
    <label>Confirm new password</label>
    <input type="password" name="confirm" required minlength="6">
    <p><button class="btn btn-gold" type="submit" style="width:100%; margin-top:14px">Set new password</button></p>
  </form>
</div>
{% endblock %}
