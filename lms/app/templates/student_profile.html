{% extends "layout_app.html" %}
{% block title %}My Profile{% endblock %}
{% block app_content %}
<div class="section-title"><h2>👤 My Profile</h2><div class="line"></div></div>
<div class="panel" style="max-width:520px">
  <form method="post" style="display:grid;gap:10px">
    <label>Name<input name="name" value="{{ user.name }}" required maxlength="120"></label>
    <label>Phone<input name="phone" value="{{ user.phone or '' }}" maxlength="20" placeholder="+91 …"></label>
    <div><button class="btn btn-gold" type="submit">Save profile</button></div>
  </form>
</div>
<div class="panel" style="max-width:520px">
  <h3 style="margin-top:0">Account settings</h3>
  <p><a class="btn btn-ghost btn-sm" href="{{ url_for('money13.timezone_settings') }}">🌍 Timezone preferences</a></p>
  <p><a class="btn btn-ghost btn-sm" href="{{ url_for('auth13.mfa_setup') }}">🔐 Two-factor (MFA) setup</a></p>
</div>
{% endblock %}
