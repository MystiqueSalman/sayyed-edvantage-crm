{% extends "base.html" %}
{% block title %}Forgot Password — Sayyed EdVantage LMS{% endblock %}
{% block content %}
<div class="panel" style="max-width:440px; margin:40px auto">
  <h2>Reset your password</h2>
  <p style="color:var(--muted)">Enter your account email and we'll send you a one-time reset link (valid 1 hour).</p>
  <form method="post">
    <label>Email</label>
    <input type="email" name="email" required autofocus>
    <p><button class="btn btn-gold" type="submit" style="width:100%; margin-top:14px">Send reset link</button></p>
  </form>
  <p style="text-align:center"><a href="{{ url_for('auth.login') }}">← Back to sign in</a></p>
</div>
{% endblock %}
