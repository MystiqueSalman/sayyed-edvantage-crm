{% extends "base.html" %}
{% block title %}All Courses — Sayyed EdVantage LMS{% endblock %}
{% block content %}
<div class="section-title"><h2>Course Catalog</h2><div class="line"></div></div>
<div class="grid">
  {% for c in courses %}
  <div class="card">
    <div class="course-banner" style="background-image:url('{{ url_for('static', filename='img/banners/' + c.banner) if c.banner }}')"></div>
    <div class="body">
      <h3>{{ c.title }}</h3>
      <p>{{ c.short_desc }}</p>
      <div class="fee">₹{{ "{:,}".format(c.fee) }} <small>+ GST</small></div>
      <a class="btn btn-gold btn-sm" href="{{ url_for('main.course_detail', slug=c.slug) }}">View Course</a>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
