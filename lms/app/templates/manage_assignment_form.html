{% extends "base.html" %}
{% block title %}{{ 'Edit' if assignment else 'New' }} Assignment — {{ course.title }}{% endblock %}
{% block content %}
<div class="panel" style="max-width:640px; margin:30px auto">
  <h2>{{ 'Edit' if assignment else 'New' }} Assignment <span style="color:var(--muted); font-size:.9rem">· {{ course.title }}</span></h2>
  <form method="post">
    <label>Title</label>
    <input type="text" name="title" value="{{ assignment.title if assignment }}" required autofocus>
    <label>Description / instructions</label>
    <textarea name="description" rows="5">{{ assignment.description if assignment }}</textarea>
    <div class="two-col">
      <div><label>Due date (optional)</label>
        <input type="date" name="due_date" value="{{ assignment.due_date if assignment and assignment.due_date }}"></div>
      <div><label>Max marks</label>
        <input type="number" name="max_marks" value="{{ assignment.max_marks if assignment else 100 }}" min="1"></div>
    </div>
    <p><button class="btn btn-gold" type="submit" style="margin-top:14px">Save Assignment</button>
    <a class="btn btn-ghost" href="{{ url_for('manage.course_home', course_id=course.id) }}" style="margin-left:10px">Cancel</a></p>
  </form>
</div>
{% endblock %}
