{% extends "base.html" %}
{% block title %}{{ 'Edit Quiz' if quiz else 'New Quiz' }} — {{ module.title }}{% endblock %}
{% block content %}
<div class="panel" style="max-width:640px; margin:30px auto">
  <h2>{{ 'Edit Quiz' if quiz else 'New Quiz' }} <span style="color:var(--muted); font-size:.9rem">· {{ module.title }}</span></h2>
  <form method="post">
    <label>Quiz title</label>
    <input type="text" name="title" value="{{ quiz.title if quiz else '' }}" required autofocus>
    <div class="two-col" style="margin-top:10px">
      <div>
        <label>Pass percentage</label>
        <input type="number" name="pass_percent" value="{{ quiz.pass_percent if quiz else 60 }}" min="1" max="100">
      </div>
      <div>
        <label>Time limit (minutes, 0 = no limit)</label>
        <input type="number" name="time_limit_min" value="{{ quiz.time_limit_min if quiz else 0 }}" min="0" max="600">
      </div>
      <div>
        <label>Exam deadline (shows on calendar, optional)</label>
        <input type="date" name="deadline" value="{{ quiz.deadline.isoformat() if quiz and quiz.deadline }}">
      </div>
    </div>
    <div class="two-col" style="margin-top:10px">
      <div>
        <label>Max attempts (0 = unlimited)</label>
        <input type="number" name="max_attempts" value="{{ quiz.max_attempts if quiz else 0 }}" min="0" max="100">
      </div>
      <div>
        <label>Negative marking per wrong MCQ (0 = none)</label>
        <input type="number" name="negative_marking" step="0.05" min="0" max="2" value="{{ quiz.negative_marking if quiz else 0 }}">
      </div>
    </div>
    <div class="two-col" style="margin-top:10px">
      <div>
        <label>Score policy</label>
        <select name="score_policy">
          <option value="best" {% if quiz and quiz.score_policy == 'best' %}selected{% endif %}>Best attempt counts</option>
          <option value="latest" {% if quiz and quiz.score_policy == 'latest' %}selected{% endif %}>Latest attempt counts</option>
        </select>
      </div>
      <div style="padding-top:24px">
        <label class="opt"><input type="checkbox" name="shuffle_questions" {% if quiz and quiz.shuffle_questions %}checked{% endif %}> Shuffle question order</label>
        <label class="opt"><input type="checkbox" name="shuffle_options" {% if quiz and quiz.shuffle_options %}checked{% endif %}> Shuffle MCQ options</label>
      </div>
    </div>
    <p><button class="btn btn-gold" type="submit" style="margin-top:14px">{{ 'Save Quiz' if quiz else 'Create & Add Questions' }}</button>
    {% if quiz %}
      <a class="btn btn-ghost" href="{{ url_for('manage.quiz_questions', quiz_id=quiz.id) }}" style="margin-left:10px">Back to Questions</a>
    {% else %}
      <a class="btn btn-ghost" href="{{ url_for('manage.course_home', course_id=course.id) }}" style="margin-left:10px">Cancel</a>
    {% endif %}</p>
  </form>
</div>
{% endblock %}
