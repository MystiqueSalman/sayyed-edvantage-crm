{% extends "base.html" %}
{% block title %}New Email Blast — Marketing{% endblock %}
{% block content %}
<div class="section-title"><h2>📧 New Email Blast</h2><div class="line"></div>
  <a href="{{ url_for('marketing.email_campaign_list') }}">← Email Campaigns</a></div>
<div class="panel" style="max-width:560px">
<form method="post">
  <label>Name</label><input name="name" required>
  <label>Message template (email channel)</label>
  <select name="template_id"><option value="">— pick a template —</option>
    {% for t in templates %}<option value="{{ t.id }}">{{ t.name }}</option>{% endfor %}</select>
  <p style="color:var(--muted); font-size:.82rem">Templates are managed in <a href="{{ url_for('hardening.templates') }}">📝 Message Templates</a> (use <span class="code-pill">{{name}}</span> for personalization).</p>
  <label>Audience</label>
  <select name="audience"><option value="leads">CRM Leads (with email)</option><option value="students">Students (with email)</option></select>
  <label>Course interest / enrollment (optional)</label>
  <select name="course_id"><option value="">— all courses —</option>
    {% for c in courses %}<option value="{{ c.id }}">{{ c.title }}</option>{% endfor %}</select>
  <label>Lead status (leads only, optional)</label>
  <select name="status"><option value="">— any status —</option>
    {% for s in statuses %}<option value="{{ s }}">{{ s }}</option>{% endfor %}</select>
  <p><button class="btn btn-gold" type="submit">Save Draft</button></p>
</form>
</div>
{% endblock %}
