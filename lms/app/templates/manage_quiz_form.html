{% extends "base.html" %}
{% block title %}New Quiz — {{ module.title }}{% endblock %}
{% block content %}
<div class="panel" style="max-width:560px; margin:30px auto">
  <h2>New Quiz <span style="color:var(--muted); font-size:.9rem">· {{ module.title }}</span></h2>
  <form method="post">
    <label>Quiz title</label>
    <input type="text" name="title" required autofocus>
    <label>Pass percentage</label>
    <input type="number" name="pass_percent" value="60" min="1" max="100">
    <p><button class="btn btn-gold" type="submit" style="margin-top:14px">Create &amp; Add Questions</button>
    <a class="btn btn-ghost" href="{{ url_for('manage.course_home', course_id=course.id) }}" style="margin-left:10px">Cancel</a></p>
  </form>
</div>
{% endblock %}
